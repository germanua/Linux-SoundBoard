[package]
name = "linux-soundboard"
version = "2.4.7"
publish = false
authors = ["germanua"]
description = "Native Linux soundboard with PipeWire virtual microphone support"
edition = "2021"
rust-version = "1.85"
license-file = "../LICENSE"
readme = "../README.md"
homepage = "https://github.com/germanua/Linux-SoundBoard"
repository = "https://github.com/germanua/Linux-SoundBoard"
keywords = ["audio", "gtk4", "pipewire", "soundboard", "wayland"]
categories = ["multimedia::audio"]

[lib]
name = "linux_soundboard"
path = "app/lib.rs"

[[bin]]
name = "linux-soundboard"
path = "app/main.rs"

[[test]]
name = "integration"
path = "tests/test_main.rs"

[build-dependencies]
glib-build-tools = "0.20"

[dependencies]
chrono = "0.4"
dirs = "5"
ebur128 = "0.1"
env_logger = "0.11"
gio = "0.20"
glib = "0.20"
gtk4 = { version = "0.9", features = ["v4_10"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
log = "0.4"
minisign-verify = "0.3.0"
nix = { version = "0.29", features = ["signal", "process", "user", "fs", "poll"] }
ogg = "0.8"
opus = "0.3"
parking_lot = "0.12"
pipewire = "0.9.2"
pulse = { version = "2", package = "libpulse-binding" }
rayon = "1.8"
rusqlite = { version = "0.39", default-features = false, features = ["backup", "bundled"] }
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

symphonia = { version = "0.5", features = ["mp3", "aac", "alac", "isomp4"] }
thiserror = "1"
ureq = { version = "3.4.2", default-features = false, features = ["gzip", "platform-verifier", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

uuid = { version = "1", features = ["v4"] }
walkdir = "2"
which = "6"
x11 = { version = "2.21", features = ["xlib", "xinput"] }

[lints]
workspace = true
