name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Build & test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libpulse-dev \
            libopus-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libx11-dev \
            libxi-dev \
            pkg-config

      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build (release)
        run: cargo build --workspace --release --locked

      - name: Test
        run: cargo test --workspace --locked

  topology-guard:
    name: Architecture guard
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fail if audio imports ui
        run: |
          if grep -r --include="*.rs" "crate::ui::" src/app/audio/; then
            echo "ERROR: audio module imports crate::ui — forbidden dependency direction"
            exit 1
          fi

      - name: Fail if audio imports commands
        run: |
          if grep -r --include="*.rs" "crate::commands::" src/app/audio/; then
            echo "ERROR: audio module imports crate::commands — forbidden dependency direction"
            exit 1
          fi

      - name: Fail if audio imports init
        run: |
          if grep -r --include="*.rs" "crate::init::" src/app/audio/; then
            echo "ERROR: audio module imports crate::init — forbidden dependency direction"
            exit 1
          fi

      - name: Fail if loudness_acceptance is in the production module graph
        run: |


          if grep -r --include="*.rs" "^pub mod loudness_acceptance" src/app/audio/; then
            echo "ERROR: loudness_acceptance declared without #[cfg(test)] gate in audio/"
            exit 1
          fi

  public-surface:
    name: Public source boundary
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check public installer scripts
        run: |
          shellcheck bootstrap-install.sh
          shellcheck -e SC1091 install.sh

      - name: Reject private or packaging trees
        run: |
          forbidden='^(packaging/|dev/|dist-dev/|\.commandcode/|\.github/workflows/private-dev\.yml$)'
          if git ls-files | grep -E "$forbidden"; then
            echo "ERROR: private build/release tooling is tracked in the public tree"
            exit 1
          fi

      - name: Reject oversized maintained source files
        run: |
          failed=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 2000 ]; then
              echo "ERROR: $file has $lines lines"
              failed=1
            fi
          done < <(git ls-files '*.rs' '*.sh' '*.py' '*.css' '*.yml' '*.yaml' '*.toml')
          exit "$failed"

  deps:
    name: Unused dependencies
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libpulse-dev \
            libopus-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libx11-dev \
            libxi-dev \
            pkg-config

      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-machete-0.8.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-machete-0.8.0-

      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.8.0 --locked

      - name: Check for unused dependencies
        run: cargo machete

  advisory-audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Audit the application lockfile
        run: cargo audit


      - name: Install cargo-deny
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          cargo +1.88.0 install cargo-deny --version 0.19.8 --locked

      - name: Enforce dependency policy
        run: cargo +1.88.0 deny check


  license-notices:
    name: Third-party license notices
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-about-0.8.4-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.8.4 --locked

      - name: Verify generated notices
        run: |
          cargo about generate --config about.toml --manifest-path Cargo.toml --workspace --locked --fail --output-file THIRD_PARTY_NOTICES.html about.hbs
          sed -i 's/[[:blank:]]\+$//' THIRD_PARTY_NOTICES.html
          git diff --exit-code -- THIRD_PARTY_NOTICES.html
