name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Build & test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libpulse-dev \
            libopus-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libx11-dev \
            libxi-dev \
            pkg-config

      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build (release)
        run: cargo build --workspace --release --locked

      - name: Test
        run: cargo test --workspace --locked

  topology-guard:
    name: Architecture guard
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Fail if audio imports ui
        run: |
          if grep -r --include="*.rs" "crate::ui::" src/app/audio/; then
            echo "ERROR: audio module imports crate::ui — forbidden dependency direction"
            exit 1
          fi

      - name: Fail if audio imports commands
        run: |
          if grep -r --include="*.rs" "crate::commands::" src/app/audio/; then
            echo "ERROR: audio module imports crate::commands — forbidden dependency direction"
            exit 1
          fi

      - name: Fail if audio imports init
        run: |
          if grep -r --include="*.rs" "crate::init::" src/app/audio/; then
            echo "ERROR: audio module imports crate::init — forbidden dependency direction"
            exit 1
          fi

      - name: Fail if loudness_acceptance is in the production module graph
        run: |


          if grep -r --include="*.rs" "^pub mod loudness_acceptance" src/app/audio/; then
            echo "ERROR: loudness_acceptance declared without #[cfg(test)] gate in audio/"
            exit 1
          fi

  metadata-validators:
    name: Package metadata validation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils \
            appstream \
            minisign \
            shellcheck

      - name: Validate desktop files
        run: |
          desktop-file-validate packaging/flatpak/com.linuxsoundboard.app.desktop
          desktop-file-validate packaging/debian/linux-soundboard.desktop
          desktop-file-validate packaging/rpm/linux-soundboard.desktop

      - name: Validate AppStream metainfo
        run: appstreamcli validate --explain --no-net packaging/flatpak/com.linuxsoundboard.app.metainfo.xml

      - name: ShellCheck installer scripts
        run: |
          shellcheck bootstrap-install.sh
          shellcheck -e SC1091 install.sh
          shellcheck packaging/common.sh
          shellcheck -e SC1090,SC2034,SC2317 packaging/profile.sh
          shellcheck packaging/validate-metadata.sh
          shellcheck -e SC2016 packaging/smoke-check.sh
          shellcheck -e SC1091,SC2016,SC2034,SC2317,SC2329 packaging/build-release.sh
          shellcheck -s bash -e SC1091,SC2016,SC2034,SC2154,SC2317,SC2329 packaging/release/*.sh
          shellcheck -e SC1090,SC1091,SC2034 packaging/linux/app-meta.sh
          shellcheck -e SC1090,SC1091 packaging/linux/install-user.sh
          shellcheck -e SC1091 packaging/linux/install-swhkd-helper.sh
          shellcheck packaging/linux/build-swhkd-locked.sh
          shellcheck -e SC1091,SC2016 packaging/linux/package-appimage.sh
          shellcheck -e SC1091 packaging/linux/package-tarball.sh
          shellcheck -e SC1091 packaging/docker/build-appimage.sh
          shellcheck packaging/docker/build-deb-appimage.sh
          shellcheck packaging/linux/appimage-preflight-check.sh
          shellcheck -e SC1091 packaging/debian/package-deb.sh
          shellcheck -e SC1091 packaging/rpm/package-rpm.sh
          shellcheck packaging/generate-checksums.sh
          python3 -m py_compile packaging/generate-update-metadata.py
          shellcheck packaging/generate-third-party-notices.sh
          shellcheck -e SC1090,SC1091,SC2016,SC2034,SC2317,SC2329 packaging/tests/swhkd-privilege-boundary-test.sh
          shellcheck -e SC1090,SC1091,SC2016 packaging/tests/appimage-tool-anchors-test.sh
          shellcheck -e SC2016 packaging/tests/install-security-policy-test.sh
          shellcheck packaging/tests/install-user-lifecycle-test.sh
          shellcheck -e SC1090,SC1091,SC2034 packaging/tests/install-wrapper-lifecycle-test.sh
          shellcheck packaging/tests/bootstrap-security-test.sh
          shellcheck packaging/tests/update-metadata-test.sh
          shellcheck packaging/tests/source-file-size-test.sh
          shellcheck -e SC1090 packaging/tests/appimage-host-compatibility-test.sh

      - name: Validate systemd service file
        run: |


          sudo install -Dm755 /bin/true /usr/local/bin/linux-soundboard
          systemd-analyze verify packaging/linux/linux-soundboard-engine.service packaging/linux/linux-soundboard-engine.target

      - name: Check desktop Icon= matches installed icon name
        run: |
          for desktop in packaging/flatpak/com.linuxsoundboard.app.desktop packaging/debian/linux-soundboard.desktop packaging/rpm/linux-soundboard.desktop; do
            icon=$(grep "^Icon=" "$desktop" | cut -d= -f2)
            if [ "$icon" != "com.linuxsoundboard.app" ]; then
              echo "ERROR: $desktop uses Icon=$icon, expected Icon=com.linuxsoundboard.app"
              exit 1
            fi
          done
          echo "All desktop Icon= values correct"

      - name: Cross-format metadata consistency
        run: bash packaging/validate-metadata.sh

      - name: Packaging smoke check
        run: bash packaging/smoke-check.sh

      - name: Packaging regression tests
        run: |
          for test in packaging/tests/*.sh; do
            echo "==> $test"
            bash "$test"
          done

  deps:
    name: Unused dependencies
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libpulse-dev \
            libopus-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libx11-dev \
            libxi-dev \
            pkg-config

      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-machete-0.8.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-machete-0.8.0-

      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.8.0 --locked

      - name: Check for unused dependencies
        run: cargo machete

  advisory-audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Audit the application lockfile
        run: cargo audit

      - name: Audit the pinned swhkd lockfile
        run: cargo audit --file packaging/linux/swhkd-Cargo.lock.pinned

      - name: Install cargo-deny
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          cargo +1.88.0 install cargo-deny --version 0.19.8 --locked

      - name: Enforce dependency policy
        run: cargo +1.88.0 deny check

      - name: Verify the embedded swhkd build digests
        run: |
          for file in packaging/linux/build-swhkd-locked.sh packaging/linux/swhkd-Cargo.lock.pinned; do
            digest="$(sha256sum "$file" | awk '{print $1}')"
            if ! grep -qF "$digest" packaging/linux/install-swhkd-helper.sh; then
              echo "ERROR: install-swhkd-helper.sh does not embed the digest of $file"
              exit 1
            fi
          done

  license-notices:
    name: Third-party license notices
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-about-0.8.4-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.8.4 --locked

      - name: Verify generated notices
        run: |
          packaging/generate-third-party-notices.sh
          git diff --exit-code -- THIRD_PARTY_NOTICES.html
