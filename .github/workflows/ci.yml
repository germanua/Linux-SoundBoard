name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Build & test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libpulse-dev \
            libopus-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libx11-dev \
            libxi-dev \
            pkg-config

      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build (release)
        run: cargo build --workspace --release --locked

      - name: Test
        run: cargo test --workspace --locked

  topology-guard:
    name: Architecture guard
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fail if audio imports ui
        run: |
          if grep -r --include="*.rs" "crate::ui::" src/app/audio/; then
            echo "ERROR: audio module imports crate::ui — forbidden dependency direction"
            exit 1
          fi

      - name: Fail if audio imports commands
        run: |
          if grep -r --include="*.rs" "crate::commands::" src/app/audio/; then
            echo "ERROR: audio module imports crate::commands — forbidden dependency direction"
            exit 1
          fi

      - name: Fail if audio imports init
        run: |
          if grep -r --include="*.rs" "crate::init::" src/app/audio/; then
            echo "ERROR: audio module imports crate::init — forbidden dependency direction"
            exit 1
          fi

      - name: Fail if loudness_acceptance is in the production module graph
        run: |
          # Reject ungated "pub mod loudness_acceptance" — a #[cfg(test)] gate
          # must appear on the same line: "#[cfg(test)] pub mod loudness_acceptance"
          if grep -r --include="*.rs" "^pub mod loudness_acceptance" src/app/audio/; then
            echo "ERROR: loudness_acceptance declared without #[cfg(test)] gate in audio/"
            exit 1
          fi

  metadata-validators:
    name: Package metadata validation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils \
            appstream \
            minisign \
            shellcheck

      - name: Validate desktop files
        run: |
          desktop-file-validate packaging/flatpak/com.linuxsoundboard.app.desktop
          desktop-file-validate packaging/debian/linux-soundboard.desktop
          desktop-file-validate packaging/rpm/linux-soundboard.desktop

      - name: Validate AppStream metainfo
        run: appstreamcli validate --explain --no-net packaging/flatpak/com.linuxsoundboard.app.metainfo.xml

      - name: ShellCheck installer scripts
        run: |
          shellcheck install.sh
          shellcheck packaging/common.sh
          shellcheck packaging/validate-metadata.sh
          shellcheck packaging/smoke-check.sh
          shellcheck packaging/linux/install-user.sh
          shellcheck packaging/linux/install-swhkd-helper.sh
          shellcheck packaging/linux/package-appimage.sh
          shellcheck packaging/linux/appimage-preflight-check.sh
          shellcheck packaging/debian/package-deb.sh
          shellcheck packaging/rpm/package-rpm.sh
          shellcheck packaging/generate-checksums.sh
          shellcheck packaging/generate-third-party-notices.sh

      - name: Validate systemd service file
        run: |
          # The metadata-only job does not build the application. Provide an
          # ephemeral executable so systemd-analyze can validate ExecStart.
          sudo install -Dm755 /bin/true /usr/local/bin/linux-soundboard
          systemd-analyze verify packaging/linux/linux-soundboard-engine.service packaging/linux/linux-soundboard-engine.target

      - name: Check desktop Icon= matches installed icon name
        run: |
          for desktop in packaging/flatpak/com.linuxsoundboard.app.desktop packaging/debian/linux-soundboard.desktop packaging/rpm/linux-soundboard.desktop; do
            icon=$(grep "^Icon=" "$desktop" | cut -d= -f2)
            if [ "$icon" != "com.linuxsoundboard.app" ]; then
              echo "ERROR: $desktop uses Icon=$icon, expected Icon=com.linuxsoundboard.app"
              exit 1
            fi
          done
          echo "All desktop Icon= values correct"

      - name: Cross-format metadata consistency
        run: bash packaging/validate-metadata.sh

      - name: Packaging smoke check
        run: bash packaging/smoke-check.sh

  deps:
    name: Unused dependencies
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libpulse-dev \
            libopus-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libx11-dev \
            libxi-dev \
            pkg-config

      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-machete-0.8.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-machete-0.8.0-

      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.8.0 --locked

      - name: Check for unused dependencies
        run: cargo machete

  license-notices:
    name: Third-party license notices
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-about-0.8.4-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.8.4 --locked

      - name: Verify generated notices
        run: |
          packaging/generate-third-party-notices.sh
          git diff --exit-code -- THIRD_PARTY_NOTICES.html
